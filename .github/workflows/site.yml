name: Website
on:
  pull_request:
  push:
    branches: [main]
  # every six hours: the wallet's newest journey media (its repository is public; it sends nothing here)
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      - name: Validate the committed site and historical evidence
        run: |
          python3 -m unittest discover -s scripts/tests
          scripts/build-site --check
      # The wallet's newest journey media replace the committed (LFS) ones in this workspace only; on any
      # failure the committed media stay. Then the pages are rebuilt from whichever media are here.
      - name: Take the wallet's UI-journey media from its CI
        env:
          # the workflow's own token: GitHub serves artifact zips only to authenticated requests
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-journey-media
      - name: Build and check the published site
        run: |
          scripts/build-site
          scripts/check-site
      # A scheduled build deploys only new wallet media: a manifest whose commit is not the deployed one's.
      - name: Decide whether to deploy
        id: decide
        run: |
          sha() { python3 -c 'import json, sys; print(json.load(sys.stdin).get("source_sha") or "")' 2>/dev/null; }
          new=$( [ -f docs/journey-provenance.json ] && sha < docs/journey-provenance.json || true)
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$new" ]; then
            echo "::notice::no wallet journey media were fetched; nothing new to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$new" = "$(curl -fsSL https://winnowwallet.com/journey-provenance.json | sha || true)" ]; then
            echo "::notice::winnowwallet.com already shows the journey media of $new"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
  # The deploy builds the site again in its own workspace rather than receiving the check's as an
  # artifact, so the private repository's artifact storage quota cannot stop a deploy. It deploys only
  # what it built and checked itself.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: website
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Prepare deployment tool
        run: printf '{"private":true}\n' > package.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
          path: source
      - name: Take the wallet's UI-journey media from its CI
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-journey-media
      - name: Build and check the published site
        working-directory: source
        run: |
          scripts/build-site
          scripts/check-site
      - name: The site to deploy
        run: mv source/docs site && rm -rf source
      - name: Deploy Winnow website
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.125.0'
          command: pages deploy site --project-name=winnow --branch=main --commit-dirty=true
